<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Генератор случайных пользователей</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css"/>
</head>
<body style="background-color: black;" text="white">
<div class="container">
    <div class="row game-card align-items-center">
        <div class="col col-md-6 offset-md-3">
            <div class="card text-center">
                <div class="card-header">
                    <p class="m-0">Окно результатов генерации</p>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col">
                            <h3><span id="firstNameOutput">Генерация имени</span></h3>
                            <h4 class="card-title"><span id="surnameOutput">Генерация фамилии</span></h4>
                            <h5><span id="secondNameOutput">Генерация отчества</span></h5>
                            <p>
                                <span id="genderOutput">пол</span>
                                <span></span>
                                <span id="birthYearOutput">Генерация года рождения</span>
                                <h6><span id="work">Генерация профессии</span></h6>
                                <button id="genereration">Сгенерировать</button>
                                <button id="clear">Сброс</button>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="personGenerator.js"></script>
<script type="module" src="init.js"></script>
</body>
</html>
